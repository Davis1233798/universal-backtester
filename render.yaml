# Private, fail-closed Render Blueprint.
# Set a strong UBT_API_TOKEN (32+ chars) privately in Render secrets.
# No anonymous API is exposed; UBT_ALLOW_EXEC remains disabled.
services:
  - type: web
    name: universal-backtester-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: UBT_PUBLIC_DEMO
        value: "0"
      - key: UBT_ALLOW_EXEC
        value: "0"
      - key: UBT_API_TOKEN
        sync: false
      - key: UBT_DB
        value: /tmp/universal-backtester-demo.sqlite3
      - key: PORT
        value: "8000"
